[package]
name = "enoki2d_editor"
version = "0.3.0"
authors = ["Lorenz Mielke"]
keywords = ["bevy", "particles", "shader", "2d", "particle"]
description = "Particle editor for the bevy_enoki crate"
repository = "https://github.com/Lommix/bevy_enoki"
license = "MIT"
readme = "README.md"
edition = "2021"

[dependencies]
bevy_egui = "0.43"
anyhow = "1.0.104"
bevy = { version = "0.20", features = ["pan_camera"] }
egui_plot = "0.37"
bevy_enoki = { path = "../enoki2d", version = "0.8" }
crossbeam = { version = "0.8.5", features = [
  "crossbeam-deque",
  "crossbeam-channel",
] }
# futures-lite = "2.3.0"
rfd = "0.17"
ron = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
tracing-subscriber = "0.3.23"

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = [
  "wasm_js",
] }
